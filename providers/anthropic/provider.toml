# Prompt caching (chat): explicit `cache_control` breakpoints delimiting the stable prefix (tools, system, messages order)
# Use headers: none.
# Use body: `cache_control` — `{"type": "ephemeral"}` per content block for explicit breakpoints, or top-level for a server-placed breakpoint; `ttl` of `5m` (default) or `1h`; per-model minimum prefix (1024 tokens default, varies)
# To get a hit: mark the end of the stable prefix and repeat the exact prefix within the TTL; verify via `cache_read_input_tokens` and `cache_creation_input_tokens` in usage
# Docs: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
name = "Anthropic"
env = ["ANTHROPIC_API_KEY"]
npm = "@ai-sdk/anthropic"
doc = "https://docs.anthropic.com/en/docs/about-claude/models"
