# Cache key (chat): scoped Google plus Vertex `cached_content` in `cachedContents/{id}` format; `prompt_cache_key` serves as cache resource on those routes alongside `cached_content`.
# Cache headers: stable prefix routing with same model.
# Cache policy: scoped Google plus Vertex-only; supply `cached_content` plus `prompt_cache_key` on those routes with cache managed directly via Google; other models follow upstream prefix reuse.
# Cache verification: cache managed directly via Google with provider usage totals.
# Docs: https://docs.frogbot.ai/api-reference/chat-completions
name = "FrogBot"
# Reasoning HTTP format (accessed 2026-06-25): POST /api/v1/chat/completions.
# JSON reasoning_effort: "low" | "medium" | "high"; Anthropic models also
# accept thinking = { type = "enabled", budget_tokens = N }.
# https://docs.frogbot.ai/api-reference/chat-completions
# Native Claude POST /api/v1/messages documents no thinking field, so the
# Chat control's native mapping and budget bounds are undocumented.
# https://docs.frogbot.ai/api-reference/messages
# Token for FrogBot's OpenAI-compatible proxy
env = ["FROGBOT_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://app.frogbot.ai/api/v1"
doc = "https://docs.frogbot.ai"
